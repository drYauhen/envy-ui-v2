<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Split layout with right pane and bottom pane">
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="28" y="36" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#334155">Split layout: left + right + bottom (default)</text>

  <rect x="30" y="54" width="260" height="216" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text x="50" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0f172a">Left pane</text>
  <text x="50" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748b">eui-pane</text>

  <rect x="310" y="54" width="420" height="102" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text x="330" y="90" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0f172a">Right pane (top)</text>
  <text x="330" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748b">eui-pane</text>

  <rect x="310" y="168" width="420" height="102" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text x="330" y="204" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0f172a">Bottom pane (right)</text>
  <text x="330" y="226" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748b">eui-pane</text>
</svg>
